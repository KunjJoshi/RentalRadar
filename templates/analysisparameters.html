<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Details</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }
    
    h2 {
      color: #333333;
      text-align: center;
      margin-top: 30px;
    }

    .navbar {
      background-color: #007bff;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 10px;
    }

    .navbar-logo {
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }

    .navbar-title {
      font-weight: bold;
      font-size: 20px;
      margin-right: auto;
      color: #ffffff;
    }

    .navbar-button {
      display: inline-block;
      padding: 10px 15px;
      margin-right: 10px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: #ffffff;
      cursor: pointer;
    }

    .navbar-button:hover {
      background-color: #0056b3;
    }
    
    form {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }
    
    input[type="submit"] {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .heading {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      color: #000;
      text-align: center;
      margin-top: 30px;
    }
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<div class="navbar">
  <img class="navbar-logo" src="{{ url_for('static', filename='RentalRadar.jpeg') }}" alt="Rental Radar Logo">
  <a class="navbar-title" src="/index">Rental Radar</a>
  <a href="/about-us" class="navbar-button">About Us</a>
  <a href="/contact-us" class="navbar-button">Contact Us</a>
  <a href="/mission" class="navbar-button">Mission</a>
  <a href="/subscribe" class="navbar-button">Subscribe</a>
</div>

  <h2>Please Enter These details for Analysis on House At</h2>
  <h4 class="heading">{{properties['address'] }}</h4>
  <form action="/analyse" method="POST">
    <input type="hidden" name="id" value="{{properties['id'] }}">
    <input type="hidden" name="beds" value="{{properties['beds'] }}">
    <input type="hidden" name="baths" value="{{properties['baths'] }}">
    <input type="hidden" name="protax" value="{{properties['protax'] }}">
    <input type="hidden" name="rent" value="{{properties['rent'] }}">
    <input type="hidden" name="address" value="{{properties['address'] }}">
    <input type="hidden" name="list_price" value="{{properties['list_price'] }}">
    <input type="hidden" name="sqft" value="{{properties['sqft'] }}">
    <input type="hidden" name="description" value="{{properties['description'] }}">
    <input type="hidden" name="image" value="{{properties['image'] }}">
    <input type="hidden" name="amortized_over" value="{{properties['amortized_over'] }}">
    <input type="hidden" name="invest_amount" value="{{properties['invest_amount'] }}">
    <input type="hidden" name="amortization_schedule" value="{{properties['amortization_schedule'] }}">
    <input type="hidden" name="monthly_exp" value="{{ properties['monthly_exp'] }}">
    <label>Increase % in Expenses:</label>
    <input type="number" id="incr-exp" name="incr_exp" required><br><br>
    <label>Increase % in Rent Income:</label>
    <input type="number" id="incr-inc" name="incr_inc"  required><br><br>
    <label>Increase % in Property Value:</label>
    <input type="number" id="incr-val" name="incr_val" required><br><br>
    <input type="submit" value="Submit">
  </form>
  
<h4 class="heading"> Obtaining Data about the listings might take some time. Please hold tight</h4>
</body>

</html>
