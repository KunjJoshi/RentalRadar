<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Subscribe - Rental Radar</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }

    .heading {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      color: #000;
      text-align: center;
      margin-top: 30px;
    }
    
    .navbar {
      background-color: #007bff;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 10px;
    }

    .navbar-logo {
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }

    .navbar-title {
      font-weight: bold;
      font-size: 20px;
      margin-right: auto;
    }

    .navbar-button {
      display: inline-block;
      padding: 10px 15px;
      margin-right: 10px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: #ffffff;
      cursor: pointer;
    }

    .navbar-button:hover {
      background-color: #0056b3;
    }

    .message-container {
      text-align: center;
      margin-top: 50px;
    }

    .message {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img class="navbar-logo" src="{{ url_for('static', filename='RentalRadar.jpeg') }}" alt="Rental Radar Logo">
    <a class="navbar-title">Rental Radar</a>
    <a href="/" class="navbar-button">Home</a>
    <a href="/about-us" class="navbar-button">About Us</a>
    <a href="/contact-us" class="navbar-button">Contact Us</a>
    <a href="/mission" class="navbar-button">Mission</a>
  </div>

  <h1 class="heading">Subscribe to Rental Radar</h1>

  <div class="message-container">
    <p class="message">The subscription service hasn't been implemented yet. Stay tuned for updates!</p>
  </div>
</body>
</html>
