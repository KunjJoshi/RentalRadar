<!DOCTYPE html>
<html>
<head>

  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;

    .heading {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      color: #000;

    }
    .navbar {

}
