<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Contact Us </title>
  <link rel="stylesheet" href="/static/navbar.css">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
<link id="u-theme-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i|Open+Sans:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i">
<link id="u-page-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme:400">
<style>
                      body, h1, h2, p, ul, li {
            margin: 0;
            padding: 0;
        }
            body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .flexbar{
          display: flex;
          flex: 10;
          width: 100%;
        }

        .image-container {
            text-align: center;
            padding: 20px;
            flex: 90;
            border-radius: 10px;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0.45)),url('/static/Big-Sur.jpg');
            background-size: inherit;
            background-position: center;
            align-items: center;
            width: 100%;
            overflow-x: auto;
        }

        .announcement{
          font-family: "Acme",sans-serif;
          font-size: 24px;
          color: #ffffff;
          margin: 10px auto;
        }
</style>
</head>
<body>
  <div class="flexbar">
    <nav class="navbar">
      <div class="logo">
        <img src="/static/RentalRadar.jpeg" alt="RentalRadar Logo">
      </div>
      <div class="links">
        <a class="nav-links" href="/index">Home</a>
        <a class="nav-links" href="about-us">About us</a>
        <a class="nav-links" href="/mission">Mission</a>
        <a class="nav-links" href="/contact-us">Contact us</a>
        <a class="nav-links" href="/subscribe">Subscribe</a>
      </div>
      <div class="hamburger">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </nav>
    <div class="dropdown">
      <a href="/index">Home</a>
      <a href="/about-us">About us</a>
      <a href="/mission">Mission</a>
      <a href="/contact-us">Contact us</a>
      <a href="/subscribe">Subscribe</a>
    </div>
    <script >
      const hamburger = document.querySelector(".hamburger");
  const dropdown = document.querySelector(".dropdown");
  
  hamburger.addEventListener("click", () => {
    dropdown.classList.toggle("active");
  });
    </script>
  </div>

  <div class="image-container">
    <h2 class="announcement">Subscriptions coming Soon!!</h2>
    <h3 class="announcement">Stay Tuned!!</h3>
  </div>
</body>
