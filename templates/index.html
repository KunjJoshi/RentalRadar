<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/static/index.css" media="screen">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</script>
  <title>Welcome To Rental Radar</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    /* Reset default margins and padding */
body, html {
    margin: 0;
    padding: 0;
  }
  
  /* Navbar styling */
  .navbar {
    background-color: white;
    width: 100%;
    height: 12.5vh; /* 1/8th of the screen */
    display: flex;
    align-items: center;
    color: black;
  }
  
  .navbar-logo {
    width: auto;
    height: 80%; /* Adjust as needed */
    margin-right: 2%; 
    margin-left: 2%/* 2% margin between logo and title */;
    float: flex-start;
  }
  
  .navbar-title {
    font-family: 'Acme', sans-serif;
    margin-right: auto; /* 2% margin between logo and title */
    align-items: flex-start;
    
  }
  .navbar-button {
    width: 6%;
    padding: 0.6vh 0.6vh;
    text-align: center;
    text-decoration: none;
    font-size: 2vh;
    color: black;
    transition: background-color 0.3s, color 0.3s;
    align-items: flex-end;
    margin-right: 1vh;
  }
  
  .navbar-button:hover {
    background-color: #000000;
    color: white;
  }
  
  /* Image container styling */
  .image-container {
    background-image: linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0.45)),url('/static/Big-Sur.jpg');
    
    background-size: cover;
    background-position: center;
    height: calc(100vh - 12.5vh); /* Total screen height - Navbar height */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  .heading {
    font-family: 'Acme', sans-serif;
    text-align: center;
    color: white;
    font-weight: bold;
  }
  /* Zip Form styling */
  .zip-form {
    background-color: white;
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 80vh;
    height: 20vh;
  }
  
  .zip-form label {
    font-family: 'Acme', sans-serif;
    font-size: 3vh;
  }
  
  .zip-form input[type="text"] {
    height: 3vh;
    width: 100%;
    margin: 3vh 0;
    padding: 5px;
    text-align: center;
    font-size: 1.78vh;
  }
  
  .zip-form input[type="submit"] {
    background-color: orange;
    color: white;
    font-weight: bold;
    border: none;
    border-radius: 5px;
    padding: 0.6vh 0.6vh;
    cursor: pointer;
    transition: background-color 0.3s;
    width: 10%;
    height: 3vh;
    font-size: 1.78vh;
  }
  
  .zip-form input[type="submit"]:hover {
    background-color: darkorange;
  }
  
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0DBNCK7C98"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-0DBNCK7C98');
</script>
<body>
  <div class="navbar">
    <img class="navbar-logo" src="{{ url_for('static', filename='RentalRadar.jpeg') }}" alt="Rental Radar Logo">
    <h1 class="navbar-title">Rental Radar</h1>
    <div class="nav-buttons">
    <a href="/about-us" class="navbar-button">About Us</a>
    <a href="/contact-us" class="navbar-button">Contact Us</a>
    <a href="/mission" class="navbar-button">Mission</a>
    <a href="/subscribe" class="navbar-button">Subscribe</a>
    </div>
  </div>
  <div class="image-container">
  <div class="heading-cover">
  <h1 class="heading">Your Zipcode + Our Analysis = Investment Success</h1>
  </div>
  <div class="heading-cover">
  <h2 class="heading">Enter Zipcode to continue...</h2>
  </div>
  <form action="/parameters" class="zip-form" method="POST">
    <label for="zipcode">Zip Code:</label>
    <input type="text" id="zipcode" name="zipcode"><br><br>
    <input type="submit" value="Submit">
  </form>
</div>
</body>
</html>
