    <style>
        /* Reset some default styles */
        body, h1, h2, p, ul, li {
            margin: 0;
            padding: 0;
        }

        /* Global styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navbar styles */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #007bff; /* Blue color */
            padding: 10px 20px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .navbar-logo {
            max-width: 100px;
            height: auto;
            margin-right: 10px;
        }

        .navbar-title {
            font-size: 2.4vh;
            color: #fff; /* White color */
            text-decoration: none;
            font-weight: bold;
        }

        .navbar-link {
            margin-right: 2vh;
            color: #fff; /* White color */
            text-decoration: none;
            padding: 2vh;
            font-weight: bold;
        }

        .navbar-link:hover{
          background-color: #f7f7f7;
          color:#333;
          transition: all .2s ease-out;
        }

        /* Image container styles */
        .image-container {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0.45)),url('/static/Big-Sur.jpg');
            background-size: cover;
            background-position: center;
            height: 86.5vh;
        }

        .heading {
            font-size: 5vh;
            margin-bottom: 1.6vh;
            color:#f7f7f7;
            font-family: "Acme",sans-serif;
        }

        .form-container{
          background-color: #f7f7f7;
          padding: 20px;
          margin: 3vh;
          max-width: 70%;
          margin-left: auto;
          margin-right: auto;
          box-shadow: 5px 5px 5px 5px #ffffff;
        }
        .zip-form {
            display: flex;
            flex-direction: column; /* Stacking elements */
            align-items: center;
            margin-top: 2vh;
        }

        .zip-label {
            font-size: 2vh;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .zip-input {
            width: 100%; /* Full width input */
            padding: 5px;
            height: 4vh;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            margin-top: 3vh;
            height: 5vh;
            width: 30%;
            font-size: larger;
        }

        /* Responsive styles */
        @media screen and (max-width: 1200px) {
            .container {
                padding: 10px;
            }
        }

        @media screen and (max-width: 992px) {
            .navbar {
                flex-direction: column;
                align-items: center;
            }

            .navbar-logo {
                margin: 10px 0;
            }

            .navbar-link {
                margin: 5px 0;
            }

            .form-container {
                max-width: 90%;
            }
        }

        @media screen and (max-width: 768px) {
            .navbar-title {
                font-size: 4vh;
            }

            .navbar-link {
                padding: 1.5vh;
            }

            .heading {
                font-size: 4vh;
            }

            .zip-label {
                font-size: 3vh;
            }

            .zip-input,
            .submit-btn {
                height: 6vh;
            }
        }

        @media screen and (max-width: 576px) {
            .navbar-link {
                font-size: 3vh;
            }

            .heading {
                font-size: 3.5vh;
            }

            .form-container {
                padding: 10px;
            }

            .zip-label {
                font-size: 2.5vh;
            }

            .zip-input,
            .submit-btn {
                height: 7vh;
            }
        }
    </style>
