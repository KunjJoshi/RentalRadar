
<!DOCTYPE html>
<html>
<head>
  <title>Welcome To Rental Radar</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }

    .heading {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      color: #000;
      text-align: center;
      margin-top: 30px;
    }
    
    .navbar {
      background-color: #007bff; /* Navbar background color */
      color: #ffffff; /* Text color */
      display: flex;
      align-items: center;
      padding: 10px;
    }

    .navbar-logo {
      width: 50px; /* Logo size */
      height: 50px; /* Logo size */
      margin-right: 10px; /* Spacing between logo and buttons */
    }

    .navbar-title {
      font-weight: bold;
      font-size: 20px;
      margin-right: auto;
    }

    .navbar-button {
      display: inline-block;
      padding: 10px 15px;
      margin-right: 10px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff; /* Button background color */
      color: #ffffff; /* Button text color */
      cursor: pointer;
    }

    .navbar-button:hover {
      background-color: #0056b3; /* Button background color on hover */
    }
    
    form {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }
    
    input[type="submit"] {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff; /* Button background color */
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    input[type="submit"]:hover {
      background-color: #0056b3; /* Button background color on hover */
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img class="navbar-logo" src="{{ url_for('static', filename='RentalRadar.jpeg') }}" alt="Rental Radar Logo">
    <h1 class="navbar-title">Rental Radar</h1>
    <a href="/about-us" class="navbar-button">About Us</a>
    <a href="/contact-us" class="navbar-button">Contact Us</a>
    <a href="/mission" class="navbar-button">Mission</a>
    <a href="/subscribe" class="navbar-button">Subscribe</a>
  </div>

  <h1 class="heading">Property Listings</h1>
  <form action="/parameters" method="POST">
    <label for="zipcode">Zip Code:</label>
    <input type="text" id="zipcode" name="zipcode"><br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
