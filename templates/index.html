<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Rental Radar</title>
    <link rel="stylesheet" href="/static/navbar.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
    <link id="u-theme-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i|Open+Sans:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i">
    <link id="u-page-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme:400">
    <style>
        /* Reset some default styles */
        /* Reset some default styles */
        body, h1, h2, p, ul, li {
            margin: 0;
            padding: 0;
        }
        /* Global styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .flexbar{
          flex: 10;
          display: flex;
        }
        /* Image container styles */
        .image-container {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0.45)),url('/static/Big-Sur.jpg');
            background-size: cover;
            background-position: center;
            flex: 95;
        }

        .heading {
            font-size: 5vh;
            margin-bottom: 1.6vh;
            color:#f7f7f7;
            font-family: "Acme",sans-serif;
        }

        .form-container{
          background-color: #f7f7f7;
          padding: 20px;
          margin: 3vh;
          max-width: 70%;
          margin-left: auto;
          margin-right: auto;
          box-shadow: 5px 5px 5px 5px #ffffff;
        }
        .zip-form {
            display: flex;
            flex-direction: column; /* Stacking elements */
            align-items: center;
            margin-top: 2vh;
        }

        .zip-label {
            font-size: 2vh;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .zip-input {
            width: 100%; /* Full width input */
            padding: 5px;
            height: 4vh;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .submit-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            margin-top: 3vh;
            height: 5vh;
            width: 30%;
            font-size: larger;
        }

        /* Responsive styles */
        @media screen and (max-width: 1200px) {
            .container {
                padding: 10px;
            }
        }

        @media screen and (max-width: 992px) {
            .navbar {
                flex-direction: column;
                align-items: center;
            }

            .navbar-logo {
                margin: 10px 0;
            }

            .navbar-link {
                margin: 5px 0;
            }

            .form-container {
                max-width: 90%;
            }
        }

        @media screen and (max-width: 768px) {
            .navbar-title {
                font-size: 4vh;
            }

            .navbar-link {
                padding: 1.5vh;
            }

            .heading {
                font-size: 4vh;
            }

            .zip-label {
                font-size: 3vh;
            }

            .zip-input,
            .submit-btn {
                height: 6vh;
            }
        }

        @media screen and (max-width: 576px) {
            .navbar-link {
                font-size: 3vh;
            }

            .heading {
                font-size: 3.5vh;
            }

            .form-container {
                padding: 10px;
            }

            .zip-label {
                font-size: 2.5vh;
            }

            .zip-input,
            .submit-btn {
                height: 7vh;
            }
        }
    </style>
</head>
<body>
  <div class="flexbar">
    <nav class="navbar">
      <div class="logo">
        <img src="/static/RentalRadar.jpeg" alt="RentalRadar Logo">
      </div>
      <div class="links">
        <a class="nav-links" href="/index">Home</a>
        <a class="nav-links" href="about-us">About us</a>
        <a class="nav-links" href="/mission">Mission</a>
        <a class="nav-links" href="/contact-us">Contact us</a>
        <a class="nav-links" href="/subscribe">Subscribe</a>
      </div>
      <div class="hamburger">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </nav>
    <div class="dropdown">
      <a href="/index">Home</a>
      <a href="/about-us">About us</a>
      <a href="/mission">Mission</a>
      <a href="/contact-us">Contact us</a>
      <a href="/subscribe">Subscribe</a>
    </div>
    <script >
      const hamburger = document.querySelector(".hamburger");
  const dropdown = document.querySelector(".dropdown");
  
  hamburger.addEventListener("click", () => {
    dropdown.classList.toggle("active");
  });
    </script>
  </div>

    <div class="image-container">
        <h1 class="heading"> Enter your Zipcode Below to start Analysis</h1>
        <div class="form-container">
            <form class="zip-form" action="/parameters" method="POST">
                <label class="zip-label">Zipcode: </label>
                <input type="text" name="zipcode" class="zip-input">
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
