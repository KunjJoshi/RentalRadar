<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>Contact Us - Rental Radar</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }

    .heading {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      color: #000;
      text-align: center;
      margin-top: 30px;
    }
    
    .navbar {
      background-color: #007bff;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 10px;
    }

    .navbar-logo {
      width: 50px;
      height: 50px;
      margin-right: 10px;
    }

    .navbar-title {
      font-weight: bold;
      font-size: 20px;
      margin-right: auto;
    }

    .navbar-button {
      display: inline-block;
      padding: 10px 15px;
      margin-right: 10px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      background-color: #007bff;
      color: #ffffff;
      cursor: pointer;
    }

    .navbar-button:hover {
      background-color: #0056b3;
    }
    
    form {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }
    
    textarea {
      resize: vertical;
    }
    
    input[type="submit"] {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    .card-container{
      display: flex;
      flex-direction: row;
      max-width: 80%;
      margin-left: auto;
      margin-right: auto;
      align-items: center;
      justify-content: center;
    }

    .card-title{
      text-align: center;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 1500;
      font-size: 30px;
    }

    .card{
      height:300px;
      width: 300px;
      margin-right:30px;
      margin-left:30px;
    justify-content: center;
  align-items: center;
text-align: center;
box-shadow: 0 0 10px #000000; 
color: #ffffff ;
background-color: #000;}

.card-content{
  text-align: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 900;
  font-style: italic;
}
  </style>
</head>
<body>
  <div class="navbar">
    <img class="navbar-logo" src="{{ url_for('static', filename='RentalRadar.jpeg') }}" alt="Rental Radar Logo">
    <a class="navbar-title">Rental Radar</a>
    <a href="/" class="navbar-button">Home</a>
    <a href="/about-us" class="navbar-button">About Us</a>
    <a href="/mission" class="navbar-button">Mission</a>
    <a href="/subscribe" class="navbar-button">Subscribe</a>
  </div>

  <h1 class="heading">Contact Us</h1>

  <div class="card-container">
    <div class="card">
      <i class="fas fa-envelope" style="align-items: center; color: black ; justify-content: center; padding: 20px; margin-left: auto; margin-right: auto;"></i>
      <h2 class="card-title">Email</h2>
      <p class="card-content">info@greenvibellc.com</p>
    </div>

    <div class="card">
      <i class="fas fa-phone" style="align-items: center; color: green ; justify-content: center; padding: 20px; margin-left: auto; margin-right: auto;"></i>
      <h2 class="card-title">Phone</h2>
      <p class="card-content">+917096582792</p>
    </div>

    <div class="card">
      <i class="fas fa-map-marker-alt" style="align-items: center; color: red ; justify-content: center; padding: 20px; margin-left: auto; margin-right: auto;"></i>
      <h2 class="card-title">Location</h2>
      <p class="card-content">2913, W Castle Pines Ter, Dublin, CA 94568</p>
    </div>

  </div>

  <h3 class="heading">Get in Touch</h3>

  <form action="/send-email" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="enquiry">Enquiry:</label>
    <textarea id="enquiry" name="enquiry" rows="5" required></textarea>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
