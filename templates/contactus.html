<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <title>Contact Us - Rental Radar</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
    }

    .heading {
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      color: #000;
      text-align: center;
      margin-top: 30px;
    }
    
    .navbar {
  background-color: #007bff;
  color: #ffffff;
  display: flex;
  align-items: center;
  padding: 1vh; /* 1% of viewport height */
}

.navbar-logo {
  width: 5vh; /* 5% of viewport height */
  height: 5vh; /* 5% of viewport height */
  margin-right: 1vh; /* 1% of viewport height */
}

.navbar-title {
  font-weight: bold;
  font-size: 2vh; /* 2% of viewport height */
  margin-right: auto;
  color: #ffffff;
}

.navbar-button {
  display: inline-block;
  padding: 1vh 1.5vh; /* 1% of viewport height and 1.5% of viewport height */
  margin-right: 1vh; /* 1% of viewport height */
  border: none;
  border-radius: 4px;
  font-size: 1.6vh; /* 1.6% of viewport height */
  font-weight: bold;
  background-color: #007bff;
  color: #ffffff;
  cursor: pointer;
}

.navbar-button:hover {
  background-color: #0056b3;
}
    
    form {
      max-width: 50%;
      margin: 1.6vh auto;
      padding: 2vh;
      background-color: #ffffff;
      border-radius: 5px;
      box-shadow: 0 0 1vh rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 1.6vh;
    }
    
    input[type="text"],
    input[type="email"],
    textarea {
      width: 90%;
      padding: 1.6vh;
      font-size: 1.75vh;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }
    
    textarea {
      resize: vertical;
    }
    
    input[type="submit"] {
      display: block;
      width: 90%;
      padding: 1.6vh;
      font-size: 1.75vh;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <img class="navbar-logo" src="{{ url_for('static', filename='RentalRadar.jpeg') }}" alt="Rental Radar Logo">
    <a class="navbar-title" href="/index">Rental Radar</a>
    <a href="/" class="navbar-button">Home</a>
    <a href="/about-us" class="navbar-button">About Us</a>
    <a href="/contact-us" class="navbar-button">Contact Us</a>
    <a href="/mission" class="navbar-button">Mission</a>
    <a href="/subscribe" class="navbar-button">Subscribe</a>
  </div>

  <h1 class="heading">Contact Us</h1>
  
  <div class="contact-info">
    <p><strong>Location:</strong> 2913, W Castle Pines Ter, Dublin, CA, 94568</p>
    <p><strong>Phone:</strong> +917096582792</p>
    <p><strong>Email:</strong> shyam@greenvibellc.com</p>
  </div>

  <h3 class="heading">Get in Touch</h3>

  <form action="/send-email" method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="enquiry">Enquiry:</label>
    <textarea id="enquiry" name="enquiry" rows="5" required></textarea>

    <input type="submit" value="Submit">
  </form>
</body>
</html>
