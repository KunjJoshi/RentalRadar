<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Contact Us </title>
  <link rel="stylesheet" href="/static/navbar.css">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RentalRadar.jpeg') }}">
<link id="u-theme-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i|Open+Sans:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i">
<link id="u-page-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme:400">
<style>
                    body, h1, h2, p, ul, li {
            margin: 0;
            padding: 0;
        }
          /* Global styles */
          body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .flexbar{
          flex: 10;
          display: flex;
          width: 100%;
        }

        .image-container {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0.45)),url('/static/Big-Sur.jpg');
            background-size: inherit;
            background-position: center;
            align-items: center;
            width: 100%;
            overflow-x: auto;
            flex: 90;
        }

        .info-container{
          width: 40%;
          max-width: 100%;
          display: flex;
          flex-direction: column;
          background-color: #ffffff;
          margin: 20px auto;
          padding: 20px;
          border-radius: 20px;
          box-shadow: 5px 5px 5px 5px #000;
        }

        .obj-container{
          max-width: 80%;
          padding: 20px;
          background-color: #000;
          margin: 5px auto;
          border-radius: 10px;
          box-shadow: 2px 2px 2px 2px #d3d3d3;
          overflow-x: auto;
        }

        .info-words{
          font-size: large;
          font-family: "Acme",sans-serif;
          color: #fff;
          max-width: 100%;
        }

        .email-submit-form{
          width: 80%;
          max-width: 100%;
          background-color: aliceblue;
          margin: 10px auto;
          border-radius: 10px;
          box-shadow: 5px 5px 5px 5px #000;
          padding: 20px;
        }

        .contact-form{
          width: 80%;
          max-width: 100%;
          display: flex;
          flex-direction: column;
          margin: 10px auto;
          align-items: baseline;
        }

        .form-label{
          font-family: "Roboto",sans-serif;
          font-size: larger;
          color: #000000;
          margin: 20px;
          font-weight: bold;
        }

        .form-input{
          border: 1px bold #000000;
          margin: 10px;
          border-radius: 10px;
          height: 3.5vh;
          width: 45%;
        }

        .enquiry-input{
          border: 1px bold #000000;
          margin: 10px;
          border-radius: 10px;
          height: 8vh;
          width: 45%;
          overflow-y: auto;
        }

        .submit-btn{
          margin: 10px;
          width: 20%;
          height: 6vh;
          background-color: #007bfb;
          color: #ffffff;
          font-weight: bold;
          font-size: larger;
          border-radius: 10px;
        }

        .contact-heading{
          font-family: "Acme",sans-serif;
          font-size: 24px;
          margin: 10px;
        }

        @media (max-width: 768px) {
          .submit-btn{
        width: 50%;
      }
      .info-container{
        width: 80%;
      }
      
      .obj-container{
        max-width: 80%;
      }

    }

    @media (max-width: 568px) {
          .submit-btn{
        width: 50%;
      }
      .info-container{
        width: 80%;
      }

      .obj-container{
        max-width: 80%;
      }
      }
    
</style>
</head>
<body>
  <div class="flexbar">
    <nav class="navbar">
      <div class="logo">
        <img src="/static/RentalRadar.jpeg" alt="RentalRadar Logo">
      </div>
      <div class="links">
        <a class="nav-links" href="/index">Home</a>
        <a class="nav-links" href="about-us">About us</a>
        <a class="nav-links" href="/mission">Mission</a>
        <a class="nav-links" href="/contact-us">Contact us</a>
        <a class="nav-links" href="/subscribe">Subscribe</a>
      </div>
      <div class="hamburger">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </nav>
    <div class="dropdown">
      <a href="/index">Home</a>
      <a href="/about-us">About us</a>
      <a href="/mission">Mission</a>
      <a href="/contact-us">Contact us</a>
      <a href="/subscribe">Subscribe</a>
    </div>
    <script >
      const hamburger = document.querySelector(".hamburger");
  const dropdown = document.querySelector(".dropdown");
  
  hamburger.addEventListener("click", () => {
    dropdown.classList.toggle("active");
  });
    </script>
  </div>

  <div class="image-container">
    <div class="info-container">
      <div class="obj-container">
        <i class="fas fa-phone" style=" color: #ffffff; height: 50px; width: 50px;"></i>
        <p class="info-words"><strong>Phone: </strong> +917096582792</p>
      </div>
      <div class="obj-container">
        <i class="fas fa-envelope" style=" color: #ffffff; height: 50px; width: 50px;"></i>
        <p class="info-words"><strong>Email: </strong> info@greenvibellc.com</p>
      </div>
    </div>

    <div class="email-submit-form">
      <h2 class="contact-heading">Contact Form</h2>
      <form class="contact-form">
        <label class="form-label" for="email"> Enter your Email Address: </label>
        <input type="email" class="form-input" name="email">
        <label class="form-label" for="name">Enter Your Name: </label>
        <input type="text" class="form-input" name="name">
        <label class="form-label" for="enquiry">Enter Your Enquiry: </label>
        <input type="text" class="enquiry-input" name="enquiry">
        <button class="submit-btn" type="submit">Submit</button>
      </form>
    </div>
  </div>


</body>
