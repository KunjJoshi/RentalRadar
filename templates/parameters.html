<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Enter Parameters</title>
  <link rel="stylesheet" href="/static/navbar.css">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='RRadar.jpeg') }}">
  <link id="u-theme-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,100i,300,300i,400,400i,500,500i,700,700i,900,900i|Open+Sans:300,300i,400,400i,500,500i,600,600i,700,700i,800,800i">
  <link id="u-page-google-font" rel="stylesheet" href="https://fonts.googleapis.com/css?family=Acme:400">
  <style>
            body, h1, h2, p, ul, li {
            margin: 0;
            padding: 0;
        }

        /* Global styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .flexbar{
          display: flex;
          flex: 10;
        }

        .image-container {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-image: linear-gradient(0deg, rgba(0,0,0,0.45), rgba(0,0,0,0.45)),url('/static/Big-Sur.jpg');
            background-size: cover;
            background-position: center;
            align-items: center;
            flex: 90;

        }
        .form-container{
            background-color: #f9f9f9;
            max-width: 30%;
            margin-left: auto;
            margin-right: auto;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 2px 2px 2px 2px #ffffff;
        }

        .heading{
          font-size: 24px;
          font-family: "Acme",sans-serif;
          font-weight: bold;
        }

        .params-form{
          display: flex;
          flex-direction: column;
          margin-bottom: 10px;
          align-items: baseline;
        }

        .form-label{
          font-family: "Acme",sans-serif;
          font-size: 15px;
        }

        .text-input{
          flex: 1; /* Expand the input to take the available space */
          padding: 8px;
          border: 1px solid #d3d3d3;
          border-radius: 4px;
          width: 70%;
          background-color: aliceblue;
        }
        
        .submit-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            height: 4vh;
            width: 30%;
            font-size: larger;
            margin-left: auto;
            margin-right: auto;
        }

        .small-heading{
          color: #ffffff;
          font-size: 20px;
          font-family: "Acme",sans-serif;
        }

        @media (max-width: 1200px) {
      .form-container {
        max-width: 50%;
      }
    }

    @media (max-width: 992px) {
      .form-container {
        max-width: 60%;
      }
    }

    @media (max-width: 768px) {
      .form-container {
        max-width: 70%;
      }
    }

    @media (max-width: 568px) {
      .form-container {
        max-width: 80%;
      }
    }
  </style>
</head>
<body>

  <div class="flexbar">
    <nav class="navbar">
      <div class="logo">
        <img src="/static/RRadar.jpeg" alt="RentalRadar Logo">
      </div>
      <div class="links">
        <a class="nav-links" href="/index">Home</a>
        <a class="nav-links" href="about-us">About us</a>
        <a class="nav-links" href="/mission">Mission</a>
        <a class="nav-links" href="/contact-us">Contact us</a>
        <a class="nav-links" href="/subscribe">Subscribe</a>
      </div>
      <div class="hamburger">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </nav>
    <div class="dropdown">
      <a href="/index">Home</a>
      <a href="/about-us">About us</a>
      <a href="/mission">Mission</a>
      <a href="/contact-us">Contact us</a>
      <a href="/subscribe">Subscribe</a>
    </div>
    <script >
      const hamburger = document.querySelector(".hamburger");
  const dropdown = document.querySelector(".dropdown");
  
  hamburger.addEventListener("click", () => {
    dropdown.classList.toggle("active");
  });
    </script>
  </div>

  <div class="image-container">
    <h3 class="small-heading">Parameters are used to calculate a rent estimate</h3>
    <div class="form-container">
      <h2 class="heading">Property Details for {{zip}}</h2>
      <form action="/listings" method="POST" class="params-form">
        <input type="hidden" name="zipcode" value="{{zip}}">
        <label class="form-label">Percentage of Down Payment:</label>
        <input class="text-input" type="number" id="down-payment" name="downpayment" placeholder="30" value="30" required><br><br>
        <label class="form-label">Current Mortgage Interest Rate:</label>
        <input class="text-input" type="number" id="interest-rate" name="interest" step="0.01" placeholder="6.5" value="6.5" required><br><br>
        <label class="form-label">Property Tax Rate:</label>
        <input class="text-input" type="number" id="property-tax" name="propertytax" step="0.01" placeholder="1.25"  value="1.25" required><br><br>
        <label class="form-label">Average Monthly Expenses:</label>
        <input class="text-input" type="number" id="monthly-expenses" name="expense" placeholder="500" value="500" required><br><br>
        <label class="form-label">Increase % in Expenses:</label>
        <input class="text-input" type="number" id="incr-exp" name="incr_exp" step="0.01" placeholder="10" value="10" required><br><br>
        <label class="form-label">Increase % in Rent Income:</label>
        <input class="text-input" type="number" id="incr-inc" name="incr_inc" step="0.01" placeholder="7" value="7" required><br><br>
        <label class="form-label">Increase % in Property Value:</label>
        <input class="text-input" type="number" id="incr-val" name="incr_val" step="0.01" placeholder="3" value="3" required><br><br>
        <input class="submit-btn" type="submit" value="Submit">
      </form>
    </div>
  </div>
</body>
