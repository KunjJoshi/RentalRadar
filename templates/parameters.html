<!DOCTYPE html>
<html>
<head>
  <title>Property Details</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
    }
    
    h2 {
      color: #333333;
      text-align: center;
    }
    
    form {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #cccccc;
      border-radius: 4px;
    }
    
    input[type="submit"] {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      background-color: #007bff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h2>Property Details for {{zip}}</h2>
  <form action="/listings" method="POST">
    <input type="hidden" name="zipcode" value="{{zip}}">
    <label>Percentage of Down Payment:</label>
    <input type="number" id="down-payment" name="downpayment" required><br><br>
    <label>Current Mortgage Interest Rate:</label>
    <input type="number" id="interest-rate" name="interest" step="0.01" required><br><br>
    <label>Property Tax Rate:</label>
    <input type="number" id="property-tax" name="propertytax" step="0.01" required><br><br>
    <label>Average Monthly Expenses:</label>
    <input type="number" id="monthly-expenses" name="expense" required><br><br>
    <input type="submit" value="Submit">
  </form>
</body>
</html>
